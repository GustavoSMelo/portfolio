        <script type="text/babel">
            const { useState, useEffect, useRef } = React;

            gsap.registerPlugin(ScrollTrigger);

            const ContactModal = ({ isOpen, onClose }) => {
                if (!isOpen) return null;

                const contacts = [
                    {
                        name: 'WhatsApp',
                        icon: '📱',
                        value: '+55 11 99999-9999',
                        link: 'https://wa.me/5511999999999',
                    },
                    {
                        name: 'Gmail',
                        icon: '✉️',
                        value: 'guty.dev@gmail.com',
                        link: 'mailto:guty.dev@gmail.com',
                    },
                    {
                        name: 'GitHub',
                        icon: '💻',
                        value: '@gutydev',
                        link: 'https://github.com/gutydev',
                    },
                    {
                        name: 'LinkedIn',
                        icon: '💼',

                ];

                return (

            };

            const modalStyles = {
                overlay: {

                },

            const Navbar = ({ onContactClick }) => {
                const [scrolled, setScrolled] = useState(false);

                useEffect(() => {
                    const handleScroll = () => setScrolled(window.scrollY > 50);
                    window.addEventListener('scroll', handleScroll);
                    return () =>
                        window.removeEventListener('scroll', handleScroll);
                }, []);

                const navLinks = [
                    { label: 'Hero', href: '#hero' },
                    { label: 'Tecnologias', href: '#technologies' },
                    { label: 'Projetos', href: '#projects' },
                    { label: 'Experiência', href: '#experience' },
                ];

                return (
                    <nav
                        style={{
                            ...navStyles.nav,
                            backgroundColor: scrolled
                                ? 'rgba(243, 232, 223, 0.95)'
                                : 'transparent',
                            backdropFilter: scrolled ? 'blur(10px)' : 'none',
                            boxShadow: scrolled
                                ? '0 2px 20px rgba(87, 89, 91, 0.1)'
                                : 'none',
                        }}
                    >
                        <div style={navStyles.container}>
                            <a href='#hero' style={navStyles.logo}>
                                <span style={navStyles.logoCoffee}>☕</span>
                                <span style={navStyles.logoText}>
                                    Guty
                                    <span style={navStyles.logoDev}>.dev</span>
                                </span>
                                <span style={navStyles.logoBracket}>/&gt;</span>
                            </a>
                            <div style={navStyles.links}>
                                {navLinks.map((link, i) => (
                                    <a
                                        key={i}
                                        href={link.href}
                                        style={navStyles.link}
                                    >
                                        {link.label}
                                    </a>
                                ))}
                                <button
                                    onClick={onContactClick}
                                    style={navStyles.cta}
                                >
                                    Contato
                                </button>
                            </div>
                        </div>
                    </nav>
                );
            };

            const navStyles = {
                nav: {
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    right: 0,
                    zIndex: 1000,
                    transition: 'all 0.3s ease',
                    padding: '15px 0',
                },
                container: {
                    width: '80%',
                    margin: '0 auto',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',

                logo: {
                    display: 'flex',

                    gap: '8px',
                    textDecoration: 'none',

                    fontWeight: '900',

                },
                logoCoffee: {
                    fontSize: '28px',
                },
                logoText: {
                    display: 'flex',
                    flexDirection: 'column',
                    lineHeight: 1,
                },
                logoDev: {
                    fontSize: '14px',
                    color: '#DD9E59',
                },
                logoBracket: {
                    fontSize: '20px',
                    color: '#57595B',
                },
                links: {
                    display: 'flex',
                    alignItems: 'center',
                    gap: '30px',
                },
                link: {
                    textDecoration: 'none',
                    color: '#452829',
                    fontWeight: '500',
                    fontSize: '16px',
                    transition: 'color 0.3s',
                },
                cta: {
                    backgroundColor: '#452829',
                    color: '#F3E8DF',
                    border: 'none',
                    padding: '12px 28px',
                    borderRadius: '8px',
                    fontSize: '16px',
                    fontWeight: '700',
                    cursor: 'pointer',
                    transition: 'transform 0.3s, box-shadow 0.3s',
                },
            };

            const Hero = ({ onContactClick }) => {
                const heroRef = useRef(null);
                const titleRef = useRef(null);
                const subtitleRef = useRef(null);
                const descRef = useRef(null);
                const btnRef = useRef(null);
                const imageRef = useRef(null);

                const roles = [
                    'Fullstack Engineer',
                    'Web Developer',
                    'Prompt Engineer',
                    'Christian',
                    'Cosplay/Cosmaker',
                    'Coffee Lover',
                    'Son of God',
                ];

                const [currentRole, setCurrentRole] = useState(0);
                const [displayedText, setDisplayedText] = useState('');
                const [isDeleting, setIsDeleting] = useState(false);

                useEffect(() => {
                    const role = roles[currentRole];
                    const timeout = setTimeout(
                        () => {
                            if (!isDeleting) {
                                if (displayedText.length < role.length) {
                                    setDisplayedText(
                                        role.slice(0, displayedText.length + 1),
                                    );
                                } else {
                                    setTimeout(() => setIsDeleting(true), 2000);
                                }
                            } else {
                                if (displayedText.length > 0) {
                                    setDisplayedText(
                                        displayedText.slice(0, -1),
                                    );
                                } else {
                                    setIsDeleting(false);
                                    setCurrentRole(
                                        (prev) => (prev + 1) % roles.length,
                                    );
                                }
                            }
                        },
                        isDeleting ? 50 : 100,
                    );

                    return () => clearTimeout(timeout);
                }, [displayedText, isDeleting, currentRole]);

                useEffect(() => {
                    gsap.fromTo(
                        [
                            titleRef.current,
                            subtitleRef.current,
                            descRef.current,
                            btnRef.current,
                        ],
                        { opacity: 0, y: 30 },
                        {
                            opacity: 1,
                            y: 0,
                            duration: 0.8,
                            stagger: 0.15,
                            ease: 'power3.out',
                        },
                    );

                    gsap.fromTo(
                        imageRef.current,
                        { opacity: 0, scale: 0.9 },
                        {
                            opacity: 1,
                            scale: 1,
                            duration: 1,
                            delay: 0.3,
                            ease: 'power3.out',
                        },
                    );

                    gsap.to(
                        [
                            titleRef.current,
                            subtitleRef.current,
                            descRef.current,
                            btnRef.current,
                            imageRef.current,
                        ],
                        {
                            y: -10,
                            duration: 2,
                            repeat: -1,
                            yoyo: true,
                            ease: 'sine.inOut',
                            stagger: 0.2,
                        },
                    );
                }, []);

                return (
                    <section id='hero' style={heroStyles.section} ref={heroRef}>
                        <div style={heroStyles.container}>
                            <div style={heroStyles.content}>
                                <h1 ref={titleRef} style={heroStyles.title}>
                                    Guty.dev
                                </h1>
                                <div
                                    ref={subtitleRef}
                                    style={heroStyles.subtitleContainer}
                                >
                                    <span style={heroStyles.subtitle}>
                                        {displayedText}
                                        <span style={heroStyles.cursor}>|</span>
                                    </span>
                                </div>
                                <p ref={descRef} style={heroStyles.description}>
                                    Desenvolvedor apaixonado por criar
                                    experiências digitais incríveis. Com sólida
                                    experiência em desenvolvimento web
                                    fullstack, combino código limpo com design
                                    intuitivo. Amante de café, cosplay e
                                    tecnologia, sempre buscando novos desafios
                                    para transformar ideias em realidade
                                    digital.
                                </p>
                                <button
                                    ref={btnRef}
                                    onClick={onContactClick}
                                    style={heroStyles.cta}
                                >
                                    Contact Me
                                </button>
                            </div>
                            <div
                                ref={imageRef}
                                style={heroStyles.imageContainer}
                            ></div>
                        </div>
                    </section>
                );
            };

            const heroStyles = {
                section: {
                    minHeight: '100vh',
                    display: 'flex',
                    alignItems: 'center',
                    paddingTop: '100px',
                },
                container: {
                    width: '80%',
                    margin: '0 auto',

                    gridTemplateColumns: '1fr 1fr',

                content: {

                    color: '#452829',
                    lineHeight: 1.1,
                },
                subtitleContainer: {
                    height: '40px',
                    overflow: 'hidden',
                },
                subtitle: {
                    fontSize: 'clamp(20px, 3vw, 28px)',

                cursor: {

                    color: '#57595B',

                },
                cta: {
                    backgroundColor: '#452829',
                    color: '#F3E8DF',
                    border: 'none',
                    padding: '16px 40px',
                    borderRadius: '8px',
                    fontSize: '18px',
                    fontWeight: '700',
                    cursor: 'pointer',
                    width: 'fit-content',
                    transition: 'transform 0.3s, box-shadow 0.3s',
                },
                imageContainer: {
                    width: '100%',
                    height: '500px',
                    borderRadius: '20px',
                    overflow: 'hidden',
                    backgroundImage: 'url(mow5amq1-hero.png)',
                    backgroundSize: 'contain',
                    backgroundPosition: 'center',
                    backgroundRepeat: 'no-repeat',
                },
            };

            const Technologies = () => {
                const sliderRef = useRef(null);

                const technologies = [
                    'Laravel',
                    'React',
                    'Next.js',
                    'NestJS',
                    'Vue.js',
                    'Git',
                    'Docker',
                    'Nginx',
                    'MariaDB',
                    'PostgreSQL',
                    'MySQL',
                    'Linux',
                    'PHP',
                ];

                useEffect(() => {
                    if (sliderRef.current) {
                        const width = sliderRef.current.scrollWidth / 2;
                        gsap.to(sliderRef.current, {
                            x: -width,
                            duration: 25,
                            ease: 'none',
                            repeat: -1,
                            modifiers: {
                                x: gsap.utils.unitize(
                                    (x) => parseFloat(x) % width,
                                ),
                            },
                        });
                    }
                }, []);

                return (
                    <section id='technologies' style={techStyles.section}>
                        <div style={techStyles.container}>
                            <h2 style={techStyles.title}>Technologies</h2>
                            <p style={techStyles.description}>
                                Tecnologias que eu uso para fazer meus projetos
                            </p>
                        </div>
                        <div style={techStyles.sliderWrapper}>
                            <div ref={sliderRef} style={techStyles.slider}>
                                {[...technologies, ...technologies].map(
                                    (tech, i) => (
                                        <div key={i} style={techStyles.tech}>
                                            <span style={techStyles.techIcon}>
                                                ☕
                                            </span>
                                            <span style={techStyles.techName}>
                                                {tech}
                                            </span>
                                        </div>
                                    ),
                                )}
                            </div>
                        </div>
                    </section>
                );
            };

            const techStyles = {
                section: {
                    padding: '100px 0',
                    overflow: 'hidden',
                },
                container: {
                    width: '80%',
                    margin: '0 auto 60px',
                    textAlign: 'center',
                },
                title: {
                    fontSize: '48px',
                    fontWeight: '900',
                    color: '#452829',
                    marginBottom: '15px',
                },
                description: {
                    fontSize: '20px',
                    color: '#57595B',
                },
                sliderWrapper: {
                    overflow: 'hidden',
                    padding: '40px 0',
                },
                slider: {
                    display: 'flex',
                    gap: '30px',
                    width: 'fit-content',
                },
                tech: {
                    display: 'flex',
                    alignItems: 'center',
                    gap: '15px',
                    backgroundColor: '#E8D1C5',
                    padding: '20px 40px',
                    borderRadius: '12px',
                    boxShadow: '0 4px 20px rgba(87, 89, 91, 0.1)',
                    whiteSpace: 'nowrap',
                },
                techIcon: {
                    fontSize: '28px',
                },
                techName: {
                    fontSize: '20px',
                    fontWeight: '700',
                    color: '#452829',
                },
            };

            const CoffeeSpill = () => {
                const cupRef = useRef(null);
                const spillRef = useRef(null);

                useEffect(() => {
                    gsap.fromTo(
                        cupRef.current,
                        { y: -50 },
                        {
                            y: 200,
                            scrollTrigger: {
                                trigger: cupRef.current,
                                start: 'top center',
                                end: 'bottom center',
                                scrub: 1,
                            },
                        },
                    );

                    gsap.fromTo(
                        spillRef.current,
                        { scaleY: 0, transformOrigin: 'top center' },
                        {
                            scaleY: 1,
                            scrollTrigger: {
                                trigger: cupRef.current,
                                start: 'top center',
                                end: 'bottom center',
                                scrub: 1,
                            },
                        },
                    );
                }, []);

                return (
                    <section style={coffeeStyles.section}>
                        <div ref={cupRef} style={coffeeStyles.cup}>
                            <div style={coffeeStyles.cupInner}>
                                <div style={coffeeStyles.coffee}></div>
                            </div>
                            <div style={coffeeStyles.handle}></div>
                        </div>
                        <div ref={spillRef} style={coffeeStyles.spill}></div>
                    </section>
                );
            };

            const coffeeStyles = {
                section: {
                    minHeight: '100vh',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    position: 'relative',
                    zIndex: 10,
                },
                cup: {
                    width: '120px',
                    height: '140px',
                    backgroundColor: '#F3E8DF',
                    borderRadius: '10px 10px 40px 40px',
                    position: 'relative',
                    boxShadow: '0 10px 30px rgba(87, 89, 91, 0.2)',
                },
                cupInner: {
                    position: 'absolute',
                    top: '15px',
                    left: '15px',
                    right: '15px',
                    bottom: '25px',
                    backgroundColor: '#452829',
                    borderRadius: '5px 5px 30px 30px',
                    overflow: 'hidden',
                },
                coffee: {
                    position: 'absolute',

                    bottom: '0',

                    borderRadius: '5px 5px 30px 30px',
                },
                handle: {

                    borderRadius: '0 30px 30px 0',

                spill: {

                    transform: 'translateX(-50%)',

            const Projects = () => {
                const [activeTab, setActiveTab] = useState('company');

                const projects = {
                    company: [
                        {
                            title: 'E-commerce Platform',
                            description:
                                'Plataforma completa de e-commerce com painel admin, carrinho, pagamentos e gestão de estoque.',
                            techs: ['Laravel', 'React', 'PostgreSQL', 'Docker'],
                            bgColor: '#57595B',
                            label: 'E-commerce',
                        },
                        {
                            title: 'CRM System',
                            description:
                                'Sistema de gestão de relacionamento com clientes com dashboard analítico e automações.',
                            techs: ['Vue.js', 'Node.js', 'MySQL', 'Nginx'],
                            bgColor: '#57595B',
